<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教員卓 — Doing History 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1524; --ink2:#16203A; --ink3:#22304F; --line:#33456B;
    --paper:#F0EADC; --dim:#96A2BC;
    --shu:#D8443C; --shuSoft:#EFA39C;
    --asagi:#6FC2C6; --asagiSoft:#A9DEE0;
    --gold:#C9A227; --goldSoft:#E4CE86;
    --serif:"Cormorant Garamond","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --sans:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--paper)}
  body{font-family:var(--sans);line-height:1.7;padding:18px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(201,162,39,.04) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(90deg, rgba(201,162,39,.04) 0 1px, transparent 1px 72px);}
  .wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto}
  .mincho{font-family:var(--serif)}
  .rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(201,162,39,.12) 55%,transparent);margin:12px 0}
  .label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .panel{background:var(--ink2);border:1px solid var(--ink3);border-radius:3px;padding:16px;margin-bottom:14px}
  .panel.shu{border-color:rgba(216,68,60,.55);box-shadow:inset 3px 0 0 var(--shu)}
  .panel.asagi{border-color:rgba(111,194,198,.45);box-shadow:inset 3px 0 0 var(--asagi)}
  .panel.gold{border-color:rgba(201,162,39,.5);box-shadow:inset 3px 0 0 var(--gold)}
  .tag{display:inline-block;padding:3px 10px;font-size:11px;letter-spacing:.14em;
    border:1px solid var(--shu);color:var(--shu);border-radius:2px}
  .tag.asagi{border-color:var(--asagi);color:var(--asagi)}
  .tag.gold{border-color:var(--gold);color:var(--gold)}
  input{background:rgba(10,16,28,.7);color:var(--paper);border:1px solid var(--line);
    border-radius:3px;padding:11px;font-size:16px;font-family:var(--serif)}
  input:focus{outline:none;border-color:var(--gold)}
  button{background:var(--shu);color:#12131A;border:0;border-radius:3px;padding:10px 16px;
    font-size:14px;font-weight:600;letter-spacing:.05em;cursor:pointer;font-family:var(--sans)}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button.asagi{background:var(--asagi)}
  button.gold{background:var(--gold)}
  button:disabled{background:var(--ink3);color:var(--dim);cursor:not-allowed}
  .row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .note{font-size:13px;color:var(--dim)}
  .ph{border:1px solid var(--line);background:transparent;color:var(--dim);
    padding:6px 11px;font-size:12px;font-weight:400;letter-spacing:.08em}
  .ph.on{background:rgba(216,68,60,.18);color:var(--paper);border-color:var(--shu)}
  .card{background:var(--ink2);border:1px solid var(--ink3);border-radius:3px;padding:12px;margin-bottom:8px}
  .card.spot{box-shadow:inset 3px 0 0 var(--shu);border-color:rgba(216,68,60,.5)}
  .grid2{display:grid;grid-template-columns:1fr 2fr;gap:9px}
  .cell{background:rgba(10,16,28,.55);border-radius:3px;padding:9px;
    font-family:var(--serif);font-size:16px;line-height:1.9}
  .cluster{background:var(--ink2);border:1px solid var(--ink3);border-radius:3px;padding:14px;margin-bottom:9px}
  .cluster.min{border-color:rgba(201,162,39,.55);box-shadow:inset 3px 0 0 var(--gold)}
  .err{border:1px solid rgba(216,68,60,.6);background:rgba(216,68,60,.12);
    color:var(--shuSoft);padding:10px 14px;border-radius:3px;margin-bottom:14px;font-size:14px}
  .cls{border:1px solid var(--line);background:transparent;color:var(--paper);
    font-family:var(--serif);font-size:16px;letter-spacing:.12em;padding:9px 18px}
  .cls.on{background:rgba(201,162,39,.16);border-color:var(--gold);color:var(--goldSoft)}
  /* 投影 */
  body.screen{padding:52px 56px}
  body.screen .wrap{max-width:1500px}
  .latin{font-family:var(--serif);font-weight:300;letter-spacing:.34em;
    font-size:13px;color:var(--gold);margin:0 0 10px;text-transform:uppercase}
  .big-q{font-family:var(--serif);font-size:50px;line-height:1.5;letter-spacing:.03em;margin:0}
  .big-a{font-family:var(--serif);font-size:32px;line-height:2;color:var(--asagiSoft);margin:0}
  .big-s{font-family:var(--serif);font-size:38px;line-height:1.7;margin:0}
  .big-h{font-family:var(--serif);font-size:32px;color:var(--shuSoft);margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div id="err" class="err" style="display:none"></div>
  <div id="app"></div>
</div>

<script>
/* ===== ここだけ書き換える ===================================== */
const API = 'ここにGASのウェブアプリURLを貼る';
const STUDENT_URL = 'https://ユーザー名.github.io/rekisi/';
/* ============================================================= */

let pin = sessionStorage.getItem('dh2026:pin') || '';
let cls = localStorage.getItem('dh2026:cls') || '';
let classes = [];
let view = 'desk';
let S = null, R = [], anon = true, busy = '';
let dNote = '', lastSig = '';

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PHASES = ['待機','問い','直感','AIの回答','本記入','解釈の分布','次の問い'];

function sig(){
  return JSON.stringify([view, cls, anon, busy,
    S&&S.id, S&&S.phase, S&&S.question, S&&S.aiStatus, (S&&S.aiAnswer||'').length, S&&S.spotlight,
    S&&S.analysis?JSON.stringify(S.analysis).length:0,
    S&&S.nextQuestions?JSON.stringify(S.nextQuestions).length:0,
    R.map(r=>[r.uid,r.hunch,r.main,r.cluster].join('|')).join(';')]);
}

async function api(p){
  const res = await fetch(API,{method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({cls:cls, pin:pin}, p))});
  return await res.json();
}
function err(m){ const e=document.getElementById('err');
  if(!m){e.style.display='none';return;} e.textContent=m; e.style.display='block';
  setTimeout(()=>e.style.display='none',8000); }

(async function(){
  const r = await api({action:'roster'});
  classes = Array.from(new Set((r.roster||[]).map(x=>String(x.cls)).filter(Boolean)));
  if(!cls) cls = classes[0]||'';
  if(!pin){ gate(); return; }
  await tick(); setInterval(tick, 4000);
})();

function gate(){
  document.getElementById('app').innerHTML = `
    <div class="panel" style="max-width:440px;margin-top:60px">
      <p class="latin">Doing History</p>
      <p class="mincho" style="font-size:30px;letter-spacing:.14em;margin:0">歴史実践</p>
      <div class="rule"></div>
      <p class="note" style="margin:0 0 18px">教員卓</p>
      <input id="p" type="password" placeholder="合言葉" style="width:100%">
      <div class="row" style="margin-top:14px"><button id="go">開く</button></div>
    </div>`;
  document.getElementById('go').onclick = async ()=>{
    pin = document.getElementById('p').value;
    const r = await api({action:'state'});
    if(r.ok && r.responses === undefined && r.session !== null){
      err('合言葉が違います'); pin=''; return;
    }
    const chk = await api({action:'setPhase', phase: r.session ? r.session.phase : 0});
    if(chk.ok === false && String(chk.error||'').indexOf('合言葉')>=0){
      err('合言葉が違います'); pin=''; return;
    }
    sessionStorage.setItem('dh2026:pin', pin);
    location.reload();
  };
}

async function tick(){
  const r = await api({action:'state'});
  if(!r.ok){ err(r.error||'通信に失敗しました'); return; }
  S = r.session; R = r.responses||[];
  if(sig()===lastSig) return;
  render();
}

function render(){
  lastSig = sig();
  document.body.className = (view==='screen') ? 'screen' : '';
  view==='screen' ? renderScreen() : renderDesk();
}

/* ================= 教員卓 ================= */
function renderDesk(){
  const app = document.getElementById('app');
  const hunch = R.filter(r=>r.hunch).length, main = R.filter(r=>r.main).length;

  let h = `<div class="row" style="margin-bottom:16px">
    <button class="ghost" id="toScreen">投影画面へ</button>
    ${classes.map(c=>`<button class="cls ${c===cls?'on':''}" data-cls="${esc(c)}">${esc(c)}</button>`).join('')}
    <button class="ghost" id="qr">生徒用QR</button>
  </div>`;

  if(!S){
    h += `<div class="panel"><p class="note">${esc(cls)} の今日の回はまだ開かれていません。</p>
      <div class="row" style="margin-top:12px"><button id="open">今日の回を開く</button></div></div>`;
    app.innerHTML = h; wireDesk(); return;
  }

  h += `<div class="panel">
    <div class="row" style="margin-bottom:12px">
      ${PHASES.map((p,i)=>`<button class="ph ${S.phase===i?'on':''}" data-ph="${i}">${i}　${p}</button>`).join('')}
    </div>
    <div class="rule"></div>
    <div class="row">
      <button class="ghost" data-ph="${Math.max(0,S.phase-1)}">戻る</button>
      <button data-ph="${Math.min(6,S.phase+1)}">進む</button>
      <span class="note">直感 ${hunch}　／　本記入 ${main}</span>
      ${S.aiStatus!=='ready'&&S.question?`<button class="asagi" id="retry">AI回答を取り直す</button>`:''}
      ${S.phase===4?`<button class="asagi" id="an">締め切って分布を作る</button>`:''}
      ${S.phase===5?`<button class="gold" id="nx">次の問いを作る</button>`:''}
      <button class="ghost" id="anon">${anon?'記名で表示':'匿名で表示'}</button>
      ${busy?`<span class="note" style="color:var(--asagi)">${esc(busy)}</span>`:''}
    </div></div>`;

  if(!S.question){
    h += `<div class="panel"><p class="note" style="margin:0">発表者の入力を待っています。生徒画面の「今日の発表者です」から入れます。</p>
      ${S.inherited?`<div class="rule"></div><p class="label">前回から引き継いだ問い</p>
        <p class="mincho" style="font-size:18px;margin:0">${esc(S.inherited)}</p>`:''}</div>`;
  }else{
    h += `<div class="panel shu">
      <div class="row" style="margin-bottom:10px"><span class="tag">${esc(S.qtype)}</span>
      <span class="note">${esc(S.presenter)}</span></div>
      <p class="mincho" style="font-size:23px;line-height:1.8;margin:0">${esc(S.question)}</p>
      ${S.intent?`<p class="note" style="margin:10px 0 0">出題意図　${esc(S.intent)}</p>`:''}
    </div>`;
    if(S.aiAnswer) h += `<div class="panel asagi"><span class="tag asagi">AIはここまでしか言っていない</span>
      <p class="mincho" style="color:var(--asagiSoft);font-size:17px;line-height:2;margin:10px 0 0">${esc(S.aiAnswer)}</p></div>`;
  }

  if(S.phase===4){
    h += `<div class="panel shu"><p class="label">教員の一手（生徒には匿名で並びます）</p>
      <div class="row"><input id="tn" maxlength="100" value="${esc(dNote)}" style="flex:1;min-width:260px" placeholder="ひとこと書いて混ぜる">
      <button id="ts">混ぜる</button></div></div>`;
  }

  h += R.map(r=>{
    const spot = S.spotlight===r.uid;
    return `<div class="card ${spot?'spot':''}">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <span class="mincho" style="font-size:16px">${anon?'—':esc(r.name)}</span>
        <span class="row">
          ${r.distance!==''&&r.distance!=null?`<span class="tag ${r.distance>=60?'gold':'asagi'}" title="AIの回答との距離">距離 ${esc(r.distance)}</span>`:''}
          ${r.cluster?`<span class="tag ${r.isMinority?'gold':'asagi'}">${esc(r.cluster)}</span>`:''}
          <button class="${spot?'':'ghost'}" data-spot="${esc(r.uid)}">${spot?'投影中':'投影する'}</button>
        </span>
      </div>
      <div class="grid2">
        <div class="cell" style="color:${r.hunch?'var(--shuSoft)':'var(--line)'}">${esc(r.hunch)||'直感なし'}</div>
        <div class="cell" style="color:${r.main?'var(--paper)':'var(--line)'}">${r.main?esc(r.opener)+esc(r.main):'未提出'}</div>
      </div>
    </div>`;
  }).join('') || `<p class="note">まだ誰も書いていません。</p>`;

  if(S.analysis) h += clusterHTML(S.analysis,false);
  if(S.analysis && S.analysis.farthest_from_ai)
    h += `<div class="panel gold"><p class="label">AIの回答から最も遠い回答</p>
      <p class="mincho" style="font-size:18px;margin:0">${esc(S.analysis.farthest_from_ai.name)}　—　${esc(S.analysis.farthest_from_ai.reason)}</p></div>`;

  h += `<div class="rule" style="margin-top:26px"></div>
    <div class="row"><button class="ghost" id="rst">今日の回答を消して待機に戻す</button></div>`;

  app.innerHTML = h; wireDesk();
}

function clusterHTML(a, big){
  let h = a.axis?`<div class="panel asagi"><p class="label">意見が分かれた軸</p>
    <p class="mincho" style="font-size:${big?34:19}px;line-height:1.8;margin:0">${esc(a.axis)}</p></div>`:'';
  h += (a.clusters||[]).map(c=>`<div class="cluster ${c.isMinority?'min':''}">
      <div class="row" style="margin-bottom:5px">
        <span class="mincho" style="font-size:${big?32:21}px;letter-spacing:.06em;${c.isMinority?'color:var(--goldSoft)':''}">${esc(c.name)}</span>
        <span class="note">${(c.members||[]).length}人</span>
        ${c.isMinority?'<span class="tag gold">少数の立場</span>':''}
      </div>
      <p class="note" style="margin:0;${big?'font-size:19px':''}">${esc(c.summary)}</p>
      <p class="note" style="margin:7px 0 0;color:var(--line);${big?'font-size:17px':''}">${(c.members||[]).map(esc).join('・')}</p>
    </div>`).join('');
  if(a.overlooked) h += `<div class="panel asagi"><p class="label">全員が触れていない論点</p>
    <p class="mincho" style="font-size:${big?30:18}px;line-height:1.8;margin:0">${esc(a.overlooked)}</p></div>`;
  return h;
}

function wireDesk(){
  const $ = id=>document.getElementById(id);
  if($('toScreen')) $('toScreen').onclick = ()=>{ view='screen'; render(); };
  if($('qr')) $('qr').onclick = ()=>{
    document.getElementById('app').innerHTML = `
      <div class="panel" style="text-align:center;max-width:420px;margin:40px auto">
        <p class="label">生徒用URL</p>
        <p class="mincho" style="font-size:15px">${esc(STUDENT_URL)}</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(STUDENT_URL)}" width="300" height="300" style="background:#fff;padding:10px;border-radius:3px">
        <div class="row" style="justify-content:center;margin-top:16px"><button class="ghost" id="bk">戻る</button></div>
      </div>`;
    document.getElementById('bk').onclick = render;
  };
  document.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{
    cls=b.dataset.cls; localStorage.setItem('dh2026:cls',cls); lastSig=''; tick();
  });
  if($('open')) $('open').onclick = async ()=>{ const r=await api({action:'openSession'});
    if(!r.ok) err(r.error); else tick(); };
  document.querySelectorAll('[data-ph]').forEach(b=>b.onclick=async ()=>{
    const r = await api({action:'setPhase', phase:b.dataset.ph});
    if(!r.ok) err(r.error); else tick();
  });
  document.querySelectorAll('[data-spot]').forEach(b=>b.onclick=async ()=>{
    const uid = S.spotlight===b.dataset.spot ? '' : b.dataset.spot;
    await api({action:'spotlight', uid:uid}); tick();
  });
  if($('anon')) $('anon').onclick = ()=>{ anon=!anon; render(); };
  if($('retry')) $('retry').onclick = async ()=>{
    busy='AIの回答を取り直しています'; render();
    const r = await api({action:'generateAI'}); busy='';
    if(!r.ok) err(r.error); lastSig=''; tick();
  };
  if($('an')) $('an').onclick = async ()=>{
    busy='解釈を分類しています'; render();
    const r = await api({action:'analyze'}); busy='';
    if(!r.ok) err(r.error); lastSig=''; tick();
  };
  if($('nx')) $('nx').onclick = async ()=>{
    busy='次の問いを作っています'; render();
    const r = await api({action:'nextQuestions'}); busy='';
    if(!r.ok) err(r.error); lastSig=''; tick();
  };
  if($('ts')){
    $('tn').oninput = e => { dNote = e.target.value; };
    $('ts').onclick = async ()=>{
      const v = dNote.trim(); if(!v) return;
      await api({action:'teacherNote', main:v}); dNote=''; lastSig=''; tick();
    };
  }
  if($('rst')) $('rst').onclick = async ()=>{
    if(!confirm('今日の回答をすべて消して待機に戻します。よろしいですか')) return;
    const r = await api({action:'resetToday'}); if(!r.ok) err(r.error); lastSig=''; tick();
  };
}

/* ================= 投影 ================= */
function renderScreen(){
  const app = document.getElementById('app');
  if(!S || S.phase===0){
    app.innerHTML = `<p class="latin">Doing History</p>
      <p class="mincho" style="font-size:40px;letter-spacing:.14em;margin:0">歴史実践</p>
      <div class="rule" style="max-width:420px"></div>
      <p class="note" style="font-size:20px">まもなく始まります</p>
      <button class="ghost" id="bk" style="margin-top:50px">教員卓へ</button>`;
    document.getElementById('bk').onclick=()=>{view='desk';render();}; return;
  }
  const spot = S.spotlight ? R.find(r=>r.uid===S.spotlight) : null;
  let h = `<div style="margin-bottom:38px">
      <p class="latin">${esc(S.qtype)}　／　${esc(S.presenter)}</p>
      <p class="big-q">${esc(S.question)}</p>
      <div class="rule" style="margin-top:22px"></div>
    </div>`;

  if(spot){
    h += `<div class="panel" style="box-shadow:inset 4px 0 0 var(--shu);border-color:rgba(216,68,60,.4)">
        <p class="label">直感</p><p class="big-h">${esc(spot.hunch)||'—'}</p></div>
      <div class="panel" style="box-shadow:inset 4px 0 0 var(--paper)">
        <p class="label">考えたこと</p>
        <p class="big-s">${esc(spot.opener)}${esc(spot.main)}</p></div>`;
  } else if(S.phase===3 && S.aiAnswer){
    h += `<div class="panel asagi"><span class="tag asagi">AIはここまでしか言っていない</span>
      <p class="big-a" style="margin-top:16px">${esc(S.aiAnswer)}</p></div>`;
  } else if(S.phase===5 && S.analysis){
    h += clusterHTML(S.analysis, true);
  } else if(S.phase===6 && S.nextQuestions){
    h += (S.nextQuestions||[]).map(q=>`<div style="margin-bottom:30px">
      <span class="tag asagi">${esc(q.type)}</span>
      <p class="mincho" style="font-size:34px;line-height:1.6;margin:10px 0 0">${esc(q.question)}</p></div>`).join('');
  }

  h += `<button class="ghost" id="bk" style="margin-top:44px">教員卓へ</button>`;
  app.innerHTML = h;
  document.getElementById('bk').onclick=()=>{view='desk';render();};
}
</script>
</body>
</html>
