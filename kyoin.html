<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>教員卓 — Doing History 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Shippori+Mincho:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1524; --ink2:#16203A; --ink3:#22304F; --line:#33456B;
    --paper:#F0EADC; --dim:#96A2BC;
    --shu:#D8443C; --shuSoft:#EFA39C;
    --asagi:#6FC2C6; --asagiSoft:#A9DEE0;
    --gold:#C9A227; --goldSoft:#E4CE86;
    --serif:"Cormorant Garamond","Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --sans:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ink);color:var(--paper)}
  body{font-family:var(--sans);line-height:1.7;padding:16px 20px 40px}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(201,162,39,.04) 0 1px, transparent 1px 72px),
      repeating-linear-gradient(90deg, rgba(201,162,39,.04) 0 1px, transparent 1px 72px);}
  .wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto}
  .mincho{font-family:var(--serif)}
  .rule{height:1px;background:linear-gradient(90deg,var(--gold),rgba(201,162,39,.12) 55%,transparent);margin:12px 0}
  .label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
  .panel{background:var(--ink2);border:1px solid var(--ink3);border-radius:3px;padding:16px;margin-bottom:14px}
  .panel.shu{border-color:rgba(216,68,60,.55);box-shadow:inset 4px 0 0 var(--shu)}
  .panel.asagi{border-color:rgba(111,194,198,.45);box-shadow:inset 4px 0 0 var(--asagi)}
  .panel.gold{border-color:rgba(201,162,39,.55);box-shadow:inset 4px 0 0 var(--gold)}
  .tag{display:inline-block;padding:3px 10px;font-size:12px;letter-spacing:.14em;
    border:1px solid var(--shu);color:var(--shu);border-radius:2px}
  .tag.asagi{border-color:var(--asagi);color:var(--asagi)}
  .tag.gold{border-color:var(--gold);color:var(--gold)}
  input{background:rgba(10,16,28,.7);color:var(--paper);border:1px solid var(--line);
    border-radius:3px;padding:11px;font-size:16px;font-family:var(--serif)}
  input:focus{outline:none;border-color:var(--gold)}
  button{background:var(--shu);color:#12131A;border:0;border-radius:3px;padding:12px 20px;
    font-size:16px;font-weight:600;letter-spacing:.05em;cursor:pointer;font-family:var(--sans)}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line);
    font-size:13px;padding:8px 13px}
  button.asagi{background:var(--asagi)}
  button.gold{background:var(--gold)}
  button:disabled{background:var(--ink3);color:var(--dim);cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .note{font-size:13px;color:var(--dim)}
  .card{background:var(--ink2);border:1px solid var(--ink3);border-radius:3px;padding:12px;margin-bottom:8px}
  .card.spot{box-shadow:inset 4px 0 0 var(--shu);border-color:rgba(216,68,60,.5)}
  .grid2{display:grid;grid-template-columns:1fr 2.2fr;gap:10px}
  .cell{background:rgba(10,16,28,.55);border-radius:3px;padding:9px;
    font-family:var(--serif);font-size:17px;line-height:1.9}
  .cluster{background:var(--ink2);border:1px solid var(--ink3);border-radius:3px;padding:14px;margin-bottom:9px}
  .cluster.min{border-color:rgba(201,162,39,.55);box-shadow:inset 4px 0 0 var(--gold)}
  .err{border:1px solid rgba(216,68,60,.6);background:rgba(216,68,60,.12);
    color:var(--shuSoft);padding:10px 14px;border-radius:3px;margin-bottom:14px;font-size:14px}
  .cls{border:1px solid var(--line);background:transparent;color:var(--paper);
    font-family:var(--serif);font-size:17px;letter-spacing:.12em;padding:9px 20px}
  .cls.on{background:rgba(201,162,39,.16);border-color:var(--gold);color:var(--goldSoft)}
  .latin{font-family:var(--serif);font-weight:300;letter-spacing:.34em;
    font-size:12px;color:var(--gold);margin:0 0 8px;text-transform:uppercase}
  .bigq{font-family:var(--serif);font-size:33px;line-height:1.6;margin:0}
  .biga{font-family:var(--serif);font-size:21px;line-height:2;color:var(--asagiSoft);margin:0}
  .spotwrap{border:1px solid rgba(216,68,60,.5);background:rgba(216,68,60,.08);
    border-radius:3px;padding:18px;margin-bottom:14px}
  .spoth{font-family:var(--serif);font-size:26px;color:var(--shuSoft);margin:0}
  .spotm{font-family:var(--serif);font-size:31px;line-height:1.7;margin:10px 0 0}
  .blind{font-family:var(--serif);font-size:31px;line-height:1.7;color:var(--goldSoft);margin:0}
  .prog{font-family:var(--serif);font-size:26px;letter-spacing:.06em}
  .lb{display:inline-block;font-family:var(--serif);font-size:13px;letter-spacing:.12em;
    border:1px solid var(--line);color:var(--dim);border-radius:2px;padding:2px 10px}
  .lb.l4{border-color:var(--gold);color:var(--goldSoft)}
  .lb.l3{border-color:rgba(201,162,39,.6);color:var(--goldSoft)}
  .lb.l2{border-color:var(--line);color:var(--paper)}
  .lb.l1{border-color:var(--line);color:var(--dim)}
  .lb.l0{border-color:rgba(111,194,198,.5);color:var(--asagi)}
</style>
</head>
<body>
<div class="wrap">
  <div id="err" class="err" style="display:none"></div>
  <div id="app"></div>
</div>

<script>
/* ===== ここだけ書き換える ===================================== */
const API = 'https://script.google.com/macros/s/AKfycbzXJQcVegsjFAV8l3P3bvErrUFTACdi7i4LIDUmnipaeSRnlJidW9oAbVSgWIq_UGcj/exec';
const STUDENT_URL = 'https://koouji4696-collab.github.io/rekisi/';
/* ============================================================= */

const LB_CLASS = {'AIと対極':'l4','独自の視点':'l3','自分の言葉':'l2','AIに寄り添う':'l1','AIをなぞる':'l0'};

let pin = sessionStorage.getItem('dh2026:pin') || '';
let cls = localStorage.getItem('dh2026:cls') || '';
let classes = [];
let S=null, R=[], anon=false, busy='', reveal=false, qrOpen=false;
let dNote='', lastSig='';

const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lbTag = l => l ? `<span class="lb ${LB_CLASS[l]||''}">${esc(l)}</span>` : '';

function sig(){
  return JSON.stringify([cls, anon, busy, reveal, qrOpen,
    S&&S.id, S&&S.phase, S&&S.question, S&&S.aiStatus, (S&&S.aiAnswer||'').length,
    S&&S.spotlight, S&&S.pdfUrl, S&&S.blindspot,
    S&&S.analysis?JSON.stringify(S.analysis).length:0,
    R.map(r=>[r.uid,r.hunch,r.main,r.cluster].join('|')).join(';')]);
}

async function api(p){
  const res = await fetch(API,{method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({cls:cls, pin:pin}, p))});
  return await res.json();
}
function err(m){ const e=document.getElementById('err');
  if(!m){e.style.display='none';return;} e.textContent=m; e.style.display='block';
  setTimeout(()=>e.style.display='none',10000); }

(async function(){
  const r = await api({action:'roster'});
  classes = Array.from(new Set((r.roster||[]).map(x=>String(x.cls)).filter(Boolean)));
  if(!cls) cls = classes[0]||'';
  if(!pin){ gate(); return; }
  await tick(); setInterval(tick, 4000);
})();

function gate(){
  document.getElementById('app').innerHTML = `
    <div class="panel" style="max-width:440px;margin-top:60px">
      <p class="latin">Doing History</p>
      <p class="mincho" style="font-size:30px;letter-spacing:.14em;margin:0">歴史実践</p>
      <div class="rule"></div>
      <p class="note" style="margin:0 0 18px">教員卓</p>
      <input id="p" type="password" placeholder="合言葉" style="width:100%">
      <div class="row" style="margin-top:14px"><button id="go">開く</button></div>
    </div>`;
  document.getElementById('go').onclick = async ()=>{
    pin = document.getElementById('p').value;
    const r = await api({action:'state'});
    if(r.ok && r.session && r.responses===undefined){ err('合言葉が違います'); pin=''; return; }
    const chk = await api({action:'setPhase', phase: r.session ? r.session.phase : 0});
    if(chk.ok===false && String(chk.error||'').indexOf('合言葉')>=0){
      err('合言葉が違います'); pin=''; return;
    }
    sessionStorage.setItem('dh2026:pin', pin);
    location.reload();
  };
}

async function tick(){
  const r = await api({action:'state'});
  if(!r.ok){ err(r.error||'通信に失敗しました'); return; }
  S = r.session; R = r.responses||[];
  if(sig()===lastSig) return;
  render();
}

/* 締め切り → 分布 → 視点 → PDF を続けて実行 */
async function wrapUp(){
  busy='解釈を分類しています'; render();
  let r = await api({action:'analyze'});
  if(!r.ok){ busy=''; err(r.error); lastSig=''; tick(); return; }

  busy='誰も触れていない視点を探しています'; lastSig=''; render();
  r = await api({action:'blindspot'});
  if(!r.ok){ busy=''; err('視点の抽出に失敗しました。分布までは出ています。'); lastSig=''; tick(); return; }

  busy='まとめPDFを作っています'; lastSig=''; render();
  r = await api({action:'makePdf'});
  busy='';
  if(!r.ok) err('PDFの作成に失敗しました。分布と視点は出ています。');
  lastSig=''; tick();
}

function render(){
  lastSig = sig();
  const app = document.getElementById('app');
  const hunch = R.filter(r=>r.hunch).length, main = R.filter(r=>r.main).length;

  if(qrOpen){
    app.innerHTML = `
      <div class="panel" style="text-align:center;max-width:520px;margin:30px auto">
        <p class="label">生徒用URL</p>
        <p class="mincho" style="font-size:19px">${esc(STUDENT_URL)}</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=360x360&data=${encodeURIComponent(STUDENT_URL)}"
          width="360" height="360" style="background:#fff;padding:12px;border-radius:3px">
        <div class="row" style="justify-content:center;margin-top:16px">
          <button class="ghost" id="qrbk">戻る</button></div>
      </div>`;
    document.getElementById('qrbk').onclick=()=>{ qrOpen=false; render(); };
    return;
  }

  let h = `<div class="row" style="margin-bottom:14px">
    ${classes.map(c=>`<button class="cls ${c===cls?'on':''}" data-cls="${esc(c)}">${esc(c)}</button>`).join('')}
    <button class="ghost" id="qr">生徒用QR</button>
    <button class="ghost" id="anon">${anon?'記名で表示':'匿名で表示'}</button>
    <button class="ghost" id="rev">${reveal?'教員用の情報を隠す':'教員用の情報を出す'}</button>
  </div>`;

  if(!S){
    h += `<div class="panel"><p class="note">${esc(cls)} の今日の回はまだ開かれていません。</p>
      <div class="row" style="margin-top:12px"><button id="open">今日の回を開く</button></div></div>`;
    app.innerHTML = h; wire(); return;
  }

  h += `<div class="panel">
    <div class="row">
      <span class="prog">直感 ${hunch}　／　本記入 ${main}</span>
      ${S.question && S.phase<5 && !busy ? `<button id="wrap" ${main<2?'disabled':''}>締め切ってまとめる</button>` : ''}
      ${S.question&&S.aiStatus!=='ready'&&!busy?`<button class="asagi" id="retry">AI回答を取り直す</button>`:''}
      ${busy?`<span class="mincho" style="font-size:20px;color:var(--asagi)">${esc(busy)}</span>`:''}
    </div>
    ${S.question && S.phase<5 && main<2 ? `<p class="note" style="margin:10px 0 0">本記入が2人以上そろうと押せます。</p>`:''}
    ${reveal?`<p class="note" style="margin:10px 0 0;color:var(--shuSoft)">
      出題意図とAIから最も遠い回答が表示されています。投影中は隠してください。</p>`:''}
  </div>`;

  const spot = S.spotlight ? R.find(r=>r.uid===S.spotlight) : null;
  if(spot){
    h += `<div class="spotwrap">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <span class="row" style="gap:10px">
          <span class="label" style="margin:0">${anon?'　':esc(spot.name)}</span>
          ${lbTag(spot.label)}
        </span>
        <button class="ghost" data-spot="${esc(spot.uid)}">投影をやめる</button>
      </div>
      ${spot.hunch?`<p class="spoth">${esc(spot.hunch)}</p>`:''}
      <p class="spotm">${esc(spot.opener||'')}${esc(spot.main||'')}</p>
    </div>`;
  }

  if(!S.question){
    h += `<div class="panel"><p class="note" style="margin:0">発表者の入力を待っています。生徒画面の「今日の発表者です」から入れます。</p>
      ${S.inherited?`<div class="rule"></div><p class="label">前回から引き継いだ視点</p>
        <p class="mincho" style="font-size:20px;margin:0">${esc(S.inherited)}</p>`:''}</div>`;
  }else{
    h += `<div class="panel shu">
      <div class="row" style="margin-bottom:10px"><span class="tag">${esc(S.qtype)}</span>
      <span class="note">${esc(S.presenter)}</span></div>
      <p class="bigq">${esc(S.question)}</p>
      ${reveal&&S.intent?`<p class="note" style="margin:12px 0 0">出題意図　${esc(S.intent)}</p>`:''}
    </div>`;
    if(S.aiAnswer) h += `<div class="panel asagi">
      <span class="tag asagi">AIはここまでしか言っていない</span>
      <p class="biga" style="margin-top:12px">${esc(S.aiAnswer)}</p></div>`;
  }

  if(S.blindspot){
    h += `<div class="panel gold">
      <p class="label" style="color:var(--gold)">今後のヒント　—　今日、誰も触れていない視点</p>
      <p class="blind">${esc(S.blindspot)}</p>
      <p class="note" style="margin:14px 0 0">この視点が、次回の出発点になります。</p></div>`;
  }

  if(S.analysis && S.phase>=5){
    const a = S.analysis;
    if(a.axis) h += `<div class="panel asagi"><p class="label">意見が分かれた軸</p>
      <p class="mincho" style="font-size:22px;line-height:1.8;margin:0">${esc(a.axis)}</p></div>`;
    h += (a.clusters||[]).map(c=>`<div class="cluster ${c.isMinority?'min':''}">
      <div class="row" style="margin-bottom:5px">
        <span class="mincho" style="font-size:24px;letter-spacing:.06em;${c.isMinority?'color:var(--goldSoft)':''}">${esc(c.name)}</span>
        <span class="note">${(c.members||[]).length}人</span>
        ${c.isMinority?'<span class="tag gold">少数の立場</span>':''}
      </div>
      <p class="note" style="margin:0;font-size:14px">${esc(c.summary)}</p>
      <p class="note" style="margin:7px 0 0;color:var(--line)">${(c.members||[]).map(esc).join('・')}</p>
    </div>`).join('');
    if(reveal && a.farthest_from_ai)
      h += `<div class="panel gold"><p class="label">AIの回答から最も遠い回答</p>
        <p class="mincho" style="font-size:18px;margin:0">${esc(a.farthest_from_ai.name)}　—　${esc(a.farthest_from_ai.reason)}</p></div>`;
  }

  if(S.pdfUrl) h += `<div class="panel asagi">
    <p class="label">今日のまとめ</p>
    <p style="margin:0 0 10px"><a href="${esc(S.pdfUrl)}" target="_blank"
      style="color:var(--asagiSoft);font-family:var(--serif);font-size:19px">まとめPDFを開く</a></p>
    <p class="note" style="margin:0">生徒の画面にも同じリンクが出ています。</p></div>`;

  if(S.question && S.phase<5){
    h += `<div class="panel shu"><p class="label">教員の一手（生徒には匿名で並びます）</p>
      <div class="row"><input id="tn" maxlength="100" value="${esc(dNote)}" style="flex:1;min-width:260px" placeholder="ひとこと書いて混ぜる">
      <button id="ts">混ぜる</button></div></div>`;
  }

  h += R.map(r=>{
    const isSpot = S.spotlight===r.uid;
    return `<div class="card ${isSpot?'spot':''}">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <span class="mincho" style="font-size:17px">${anon?'—':esc(r.name)}</span>
        <span class="row">
          ${lbTag(r.label)}
          ${reveal&&r.distance!==''&&r.distance!=null?`<span class="note">${esc(r.distance)}</span>`:''}
          ${r.cluster?`<span class="tag ${r.isMinority?'gold':'asagi'}">${esc(r.cluster)}</span>`:''}
          <button class="${isSpot?'':'ghost'}" data-spot="${esc(r.uid)}">${isSpot?'投影中':'投影する'}</button>
        </span>
      </div>
      <div class="grid2">
        <div class="cell" style="color:${r.hunch?'var(--shuSoft)':'var(--line)'}">${esc(r.hunch)||'直感なし'}</div>
        <div class="cell" style="color:${r.main?'var(--paper)':'var(--line)'}">${r.main?esc(r.opener)+esc(r.main):'未提出'}</div>
      </div>
    </div>`;
  }).join('') || `<p class="note">まだ誰も書いていません。</p>`;

  h += `<div class="rule" style="margin-top:26px"></div>
    <div class="row">
      ${S.phase>=5?`<button class="ghost" id="back4">本記入の受付に戻す</button>`:''}
      <button class="ghost" id="rst">今日の回答を消して待機に戻す</button>
    </div>`;

  app.innerHTML = h; wire();
}

function wire(){
  const $ = id=>document.getElementById(id);
  if($('qr')) $('qr').onclick = ()=>{ qrOpen=true; render(); };
  document.querySelectorAll('[data-cls]').forEach(b=>b.onclick=()=>{
    cls=b.dataset.cls; localStorage.setItem('dh2026:cls',cls); lastSig=''; tick();
  });
  if($('open')) $('open').onclick = async ()=>{
    const r=await api({action:'openSession'}); if(!r.ok) err(r.error); else { lastSig=''; tick(); } };
  document.querySelectorAll('[data-spot]').forEach(b=>b.onclick=async ()=>{
    const uid = S.spotlight===b.dataset.spot ? '' : b.dataset.spot;
    await api({action:'spotlight', uid:uid}); lastSig=''; tick();
  });
  if($('anon')) $('anon').onclick = ()=>{ anon=!anon; render(); };
  if($('rev')) $('rev').onclick = ()=>{ reveal=!reveal; render(); };
  if($('wrap')) $('wrap').onclick = wrapUp;
  if($('retry')) $('retry').onclick = async ()=>{
    busy='AIの回答を取り直しています'; render();
    const r = await api({action:'generateAI'}); busy='';
    if(!r.ok) err(r.error); lastSig=''; tick();
  };
  if($('back4')) $('back4').onclick = async ()=>{
    await api({action:'setPhase', phase:2}); lastSig=''; tick();
  };
  if($('ts')){
    $('tn').oninput = e => { dNote = e.target.value; };
    $('ts').onclick = async ()=>{
      const v = dNote.trim(); if(!v) return;
      await api({action:'teacherNote', main:v}); dNote=''; lastSig=''; tick();
    };
  }
  if($('rst')) $('rst').onclick = async ()=>{
    if(!confirm('今日の回答をすべて消して待機に戻します。よろしいですか')) return;
    const r = await api({action:'resetToday'}); if(!r.ok) err(r.error); lastSig=''; tick();
  };
}
</script>
</body>
</html>
